#
# Builds the update site of the GAMA Developer Tools (gama.p2site.devtools) and publishes it on the GitHub Pages
# of this repository: https://gama-platform.org/gama/devtools/
#
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions" (enabled). The organisation domain
# redirects https://gama-platform.github.io/gama/ to https://gama-platform.org/gama/.
#

name: "Publish GAMA Developer Tools"

on:
  push:
    branches:
      - main
    paths:
      - 'gama.ui.devtools/**'
      - 'gama.feature.devtools/**'
      - 'gama.p2site.devtools/**'
      - '.github/workflows/publish-devtools.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: maven

      # Tycho 5.0.2 dependency collection fails with the runner's Maven 3.10.0.
      - name: Set up Maven 3.9.16
        env:
          MAVEN_VERSION: "3.9.16"
        run: |
          base="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive.sha512" -o "$RUNNER_TEMP/$archive.sha512"
          checksum=$(cat "$RUNNER_TEMP/$archive.sha512")
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" --version

      # The parent pom declares the GAML annotation processor for every module
      - name: Install the annotations and the annotation processor
        run: |
          mvn -B -q -f gama.annotations/pom.xml install -DskipTests -Dmaven.build.cache.enabled=false
          mvn -B -q -f gama.processor/pom.xml install -DskipTests -Dmaven.build.cache.enabled=false

      - name: Build the update site
        run: |
          mvn -B -e -f gama.parent/pom.xml -pl ../gama.ui.devtools,../gama.feature.devtools,../gama.p2site.devtools \
            -DskipTests -Dmaven.build.cache.enabled=false package

      - name: Restore the published site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir _site
          git -C _site init -b devtools-site
          git -C _site remote add origin "https://github.com/${REPOSITORY}.git"
          gh auth setup-git
          # Exit 2 means the branch does not exist; authentication/network failures must fail the job.
          status=0
          git -C _site ls-remote --exit-code --heads origin refs/heads/devtools-site > /tmp/devtools-site-ref || status=$?
          if [ "$status" -eq 0 ]; then
            git -C _site fetch --depth=1 origin devtools-site
            git -C _site checkout -B devtools-site FETCH_HEAD
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          else
            previous=$(gh run list --repo "$REPOSITORY" --workflow publish-devtools.yaml \
              --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$previous" ]; then
              gh run download "$previous" --repo "$REPOSITORY" --name github-pages --dir /tmp/previous-pages
              tar -xf /tmp/previous-pages/artifact.tar -C _site
            fi
          fi

      - name: Assemble the versioned composite site
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -m unittest discover -s gama.p2site.devtools -p 'test_publish.py'
          python3 gama.p2site.devtools/publish.py \
            gama.p2site.devtools/target/repository _site/devtools "${RUN_ID}-${RUN_ATTEMPT}"
          cp gama.p2site.devtools/index.html _site/devtools/index.html
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=devtools/">
          <title>GAMA</title></head>
          <body><a href="devtools/">GAMA Developer Tools update site</a></body></html>
          EOF

      - name: Retain published repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C _site config user.name "github-actions[bot]"
          git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _site add .
          git -C _site commit -m "Publish devtools build ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C _site push origin HEAD:refs/heads/devtools-site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}devtools/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
