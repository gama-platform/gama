name: "[./.github/workflows/travis-publish.yaml]"

on:
  workflow_call:
    inputs:
      RELEASE_VERSION:
        required: true
        default: 2024.03.0
        type: string
      COMMIT_SHA:
        required: true
        type: string
      IS_STABLE_RELEASE:
        required: true
        default: false
        type: boolean
      RELEASE_GITHUB:
        required: true
        default: false
        type: boolean
      RELEASE_DOCKER:
        required: true
        default: false
        type: boolean
      RELEASE_MICROSOFT:
        required: true
        default: false
        type: boolean
      RELEASE_LINUX_PPA:
        required: true
        default: false
        type: boolean
      RELEASE_NPM_GAML:
        required: true
        default: false
        type: boolean
    secrets:
      BOT_TOKEN:
        required: true

jobs:
  publish-github:
    if: "${{ inputs.RELEASE_GITHUB == true }}"
    name: Embedding JDK in GAMA
    uses: ./.github/workflows/travis-publish-github.yaml
    with:
      IS_STABLE_RELEASE: ${{ inputs.IS_STABLE_RELEASE }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      COMMIT_SHA: ${{ inputs.COMMIT_SHA }}
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  publishing-third-party:
    needs: publish-github
    name: Publish archives to 3rd parties
    uses: ./.github/workflows/travis-publish-third-party.yaml
    with:
      tag: ${{ inputs.RELEASE_VERSION }}
      IS_STABLE_RELEASE: ${{ inputs.IS_STABLE_RELEASE }}
      RELEASE_DOCKER: ${{ inputs.RELEASE_DOCKER }}
      RELEASE_MICROSOFT: ${{ inputs.RELEASE_MICROSOFT }}
      RELEASE_LINUX_PPA: ${{ inputs.RELEASE_LINUX_PPA }}
      RELEASE_NPM_GAML: ${{ inputs.RELEASE_NPM_GAML }}
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
