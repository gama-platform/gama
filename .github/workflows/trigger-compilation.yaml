# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: "Continuous project validation"

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    paths-ignore:
      - '.github/**'
      - 'travis/**'

  workflow_dispatch:  # For manual trigger
    inputs:
      USE_BUILD_CACHE:
        type: boolean
        default: true
      USE_DEPENDENCY_CACHE:
        type: boolean
        default: true

jobs:

  # Detect whether the pushed branch already has an open PR. If so, the PR
  # validation workflow (trigger-pr.yaml) handles compilation, so we skip here
  # to avoid running the same build twice. Manual dispatches always proceed.
  check-pr:
    name: Check for open PR on branch
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.query.outputs.count }}
    steps:
      - id: query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push event, no PR guard applied."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          echo "Found $n open PR(s) for branch ${{ github.ref_name }}"
          echo "count=$n" >> "$GITHUB_OUTPUT"

  ci-release:
    if: ${{ contains(github.event.head_commit.message, 'ci release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release
        run: |
          echo "'ci release' Commit message detected!"
          echo "Triggering workflow '/.github/workflows/travis-gama-release.yaml'..."
          releaseVersion=$(date +"%Y").$(date +"%m").0
          #
          # Manually trigger the target workflow
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BOT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gama-platform/gama/actions/workflows/trigger-gama-release.yaml/dispatches \
            -d "{\"ref\":\"${REF_NAME}\",\"inputs\":{\"IS_STABLE_RELEASE\":false,\"tag\":\"$releaseVersion\"}}"
        env:
          REF_NAME: ${{ github.ref_name }}

  compiling-gama:
    needs: check-pr
    if: ${{ !contains(github.event.head_commit.message, 'ci release') && needs.check-pr.outputs.has_pr == '0' }}
    name: Compiling GAMA
    uses: ./.github/workflows/travis-build.yaml
    with:
      get_testing_compiled_archives: true
      get_all_archives_for_release: false
      USE_BUILD_CACHE: ${{ inputs.USE_BUILD_CACHE || github.event_name == 'push' }}
      USE_DEPENDENCY_CACHE: ${{ inputs.USE_DEPENDENCY_CACHE || github.event_name == 'push' }}

  testing-gama:
    name: Testing built GAMA
    needs: compiling-gama
    uses: ./.github/workflows/travis-build-test.yaml
